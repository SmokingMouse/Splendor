[project]
name = "splendor-backend"
version = "0.1.0"
description = "Splendor human-vs-AI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "numpy>=1.26",
]

[dependency-groups]
train = [
  "torch>=2.4",
  "ray[default]>=2.10",
  "tensorboard>=2.16",
  "tqdm>=4.66",
  "rich>=13.7",
  # tensorboard 2.20 imports pkg_resources; setuptools 81+ removed it
  "setuptools<81",
]
dev = [
  "torch>=2.4",
  "tensorboard>=2.16",
  "tqdm>=4.66",
  "rich>=13.7",
  "pytest>=8.0",
  "setuptools<81",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
